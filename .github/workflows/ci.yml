name: CI

on:
  push:
    branches: [wastelands-dev]
  pull_request:
    branches: [wastelands-dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Witcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Wastelands.sln

      - name: Build
        run: dotnet build Wastelands.sln --no-restore --configuration Release

      - name: Test — Domain
        run: >
          dotnet test Core/Wastelands.Service.Domain.UnitTest/Wastelands.Service.Domain.UnitTest.csproj
          --no-build --configuration Release

      - name: Test — Application
        run: >
          dotnet test Core/Wastelands.Service.Application.UnitTest/Wastelands.Service.Application.UnitTest.csproj
          --no-build --configuration Release

      - name: Test — Infrastructure (integration, Testcontainers)
        run: >
          dotnet test Infrastructure/Wastelands.Service.Infrastructure.IntegrationTest/Wastelands.Service.Infrastructure.IntegrationTest.csproj
          --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: witcher-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: witcher-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
